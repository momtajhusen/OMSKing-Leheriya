name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/Momtaj_Projects/omskingleheriya_backend
            git config --global --add safe.directory /home/ubuntu/Momtaj_Projects/omskingleheriya_backend || true
            git pull --ff-only origin main
            pnpm install --frozen-lockfile
            pm2 restart omsking-backend --update-env
            pm2 save
            sleep 3
            curl -fsS http://127.0.0.1:5005/api/v1 >/dev/null
            echo "Backend deployed and healthy"
